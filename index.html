<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171428">
  <title>Synth Radio</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="app-icons/app-icon-192.png">
  <link rel="apple-touch-icon" href="app-icons/app-icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>
    <div class="seg" role="group" aria-label="Mode">
      <button data-mode="manual" aria-pressed="true">Manual</button>
      <button data-mode="radio" aria-pressed="false">Radio</button>
    </div>

    <section class="now" aria-live="polite">
      <div class="titlebar">
        <h1 id="title">Ready</h1>
		<!-- build date stamp -->
			<!-- build date stamp -->
				<!-- build date stamp -->
        <span class="build" aria-hidden="true">261031-2134</span>
      </div>
      <p id="meta"></p>
      <p id="section">Stopped</p>
      <p id="active"></p>
      <p id="debug"></p>
    </section>

    <div class="transport">
      <button id="play" class="primary">Play</button>
      <button id="next" hidden>Next song</button>
    </div>

    <label class="field">Style <select id="style"></select></label>
    <label class="check" id="all-styles-row" hidden><input type="checkbox" id="all-styles"> Radio hops between all styles</label>

    <div class="grid">
      <label class="field">Key <select id="key"></select></label>
      <label class="field">Progression <select id="prog"></select></label>
    </div>

    <div class="field">BPM
      <div class="level big">
        <button id="bpm-down" aria-label="Slower">−</button>
        <output id="bpm">0</output>
        <button id="bpm-up" aria-label="Faster">+</button>
      </div>
    </div>

    <section id="mixer" aria-label="Instruments"></section>
  </main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
